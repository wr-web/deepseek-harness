# Keyless assembled recall scenario: two fresh root sessions share one live
# Session Query corpus, then the target's first step receives the source's
# completed checkpoint through context-graph provenance.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: context-source
              sessionId: context-source
              provider: context-graph-mock
              model: context-graph-mock
              cwd: !!js process.cwd()
            - id: context-target
              sessionId: context-target
              provider: context-graph-mock
              model: context-graph-mock
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: You are a concise context-graph snapshot agent.
      - insert:
          - id: session-query
            name: '@deepseek-ai/dsh-session-query'
          - id: context-graph
            name: '@deepseek-ai/dsh-context-graph'
            config:
              autoRecall: true
              sameWorkspaceOnly: true
              includeSubagents: false
              maxSessions: 20
              maxNodesPerSession: 20
              readConcurrency: 2
              maxTextBytes: 4096
              maxRecallBytes: 2048
              matchLimit: 5
              minScore: 0.4
              staleAfterMs: 2592000000
              cacheTtlMs: 10000
          - id: context-graph-mock
            name: './tests/fixtures/context-graph-mock-llm.ts'
